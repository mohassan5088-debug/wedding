<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed &amp; Alaa – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&amp;family=Jost:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe3f2;--glow:#fde7c8;--paper:#fffdf8;--ink:#26302f;--lily:#ee9db1;--gold:#b08a4e;--teal:#17626b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#bfe3f2;--glow:#fde7c8;--paper:#fffdf8;--ink:#26302f}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:linear-gradient(var(--sky) 30%,var(--glow));background-attachment:fixed;color:var(--ink);font-family:Jost,Helvetica,Arial,sans-serif;overflow-x:hidden}
.sun{position:fixed;top:6%;right:12%;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fff6d6 25%,#ffe19a 55%,rgba(255,225,154,0) 72%);animation:rise 4s ease-out both,glow 5s ease-in-out 4s infinite;pointer-events:none}
@keyframes rise{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{50%{transform:scale(1.12)}}
.waves{position:fixed;left:0;right:0;bottom:0;height:90px;pointer-events:none;overflow:hidden}
.waves svg{width:200%;height:100%;animation:flow 12s linear infinite}
.waves svg+svg{position:absolute;left:0;bottom:-10px;opacity:.7;animation-duration:18s;animation-direction:reverse}
@keyframes flow{to{transform:translateX(-50%)}}
#intro{position:fixed;inset:0;display:grid;place-items:center;z-index:5;transition:opacity .9s ease,transform .9s ease;padding:20px}
#intro.gone{opacity:0;transform:scale(1.15);pointer-events:none}
.env{position:relative;width:min(320px,86vw);aspect-ratio:4/3;background:#f6eedf;border-radius:6px;box-shadow:0 22px 44px rgba(23,98,107,.3);perspective:900px;cursor:pointer;animation:float 3.5s ease-in-out infinite}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.5%,#e8dcc6 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#e8dcc6 50%) right/50% 100% no-repeat;border-radius:6px}
.flap{position:absolute;top:0;left:0;right:0;height:58%;background:#eee2cc;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease}
.env.open{animation:none}.env.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;top:58%;left:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:var(--teal);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.3);animation:beat 1.6s ease-in-out infinite;transition:opacity .4s}
.seal svg{width:40px;height:40px}
.env.open .seal{opacity:0}
.hint{position:absolute;bottom:-46px;width:100%;text-align:center;color:var(--teal);font-size:15px;letter-spacing:.04em}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes beat{50%{transform:scale(1.12)}}
main{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:28px 16px 110px}
.card{width:min(440px,100%);background:var(--paper);border-radius:4px;padding:34px 28px 36px;text-align:center;outline:1px solid var(--gold);outline-offset:-12px;box-shadow:0 18px 40px rgba(23,98,107,.18);opacity:0;transform:translateY(40px) scale(.96);transition:opacity 1s ease .3s,transform 1s ease .3s}
body.show .card{opacity:1;transform:none}
.art{position:relative;width:230px;margin:0 auto 4px}
.art .couple{width:170px;display:block;margin:0 auto;animation:bob 4s ease-in-out infinite}
.art .fl{position:absolute;bottom:6px;width:48px;height:48px}
.fl.a{left:0;transform:rotate(-20deg)}.fl.b{right:0;transform:rotate(20deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
body.show .art{animation:pop 1.2s ease .5s both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.lead{margin:8px 0 6px;font-size:16px;line-height:1.8;letter-spacing:.03em}
.names{font:700 54px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--teal);margin:10px 0}
.names span{display:block;font:italic 500 28px "Cormorant Garamond",Georgia,serif;color:var(--gold);line-height:1.1}
.names b{display:inline-block;clip-path:inset(0 100% 0 0)}
body.show .names b{animation:write 1.4s ease forwards}
body.show .names b+span+b{animation-delay:1.1s}
@keyframes write{to{clip-path:inset(0)}}
.when{margin:20px 0 4px;font:700 28px "Cormorant Garamond",Georgia,serif}
.time,.where{font-size:16px;line-height:1.9}
.where strong{font-weight:500}
.cd{display:flex;justify-content:center;gap:10px;margin:24px 0}
.cd div{min-width:68px;padding:10px 6px;border:1px solid var(--gold);border-radius:4px}
.cd strong{display:block;font:700 28px "Cormorant Garamond",Georgia,serif;color:var(--teal)}
.cd small{font-size:13px}
.btn{display:inline-block;margin-top:6px;padding:13px 30px;background:var(--teal);color:#fff;text-decoration:none;border-radius:40px;font-size:16px;transition:transform .2s,background .2s}
.btn:hover,.btn:focus-visible{background:#0f4d55;transform:translateY(-2px);outline:2px solid var(--gold);outline-offset:3px}
.note{margin-top:22px;font:italic 500 19px "Cormorant Garamond",Georgia,serif;opacity:.8}
.petal{position:fixed;top:-40px;width:14px;height:26px;background:linear-gradient(#fff,var(--lily));border-radius:50% 50% 50% 50%/80% 80% 20% 20%;opacity:.9;z-index:9;pointer-events:none;box-shadow:0 0 4px rgba(238,157,177,.6);animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.names b{clip-path:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="L"><g fill="#fff" stroke="#ee9db1" stroke-width="1.2">
<path d="M50 50C38 38 38 14 50 4C62 14 62 38 50 50Z"/>
<path d="M50 50C36 46 18 30 16 18C30 16 46 28 50 50Z"/>
<path d="M50 50C64 46 82 30 84 18C70 16 54 28 50 50Z"/>
<path d="M50 50C40 60 22 62 12 56C18 44 36 42 50 50Z"/>
<path d="M50 50C60 60 78 62 88 56C82 44 64 42 50 50Z"/>
<path d="M50 50C44 66 44 82 50 92C56 82 56 66 50 50Z" fill="#f9dfe6"/></g>
<circle cx="50" cy="50" r="5" fill="#b08a4e"/></g></defs></svg>

<div class="sun" aria-hidden="true"></div>
<div class="waves" aria-hidden="true">
<svg viewBox="0 0 1200 90" preserveAspectRatio="none"><path fill="#62b4c9" d="M0 40Q150 10 300 40T600 40T900 40T1200 40V90H0Z"/></svg>
<svg viewBox="0 0 1200 90" preserveAspectRatio="none"><path fill="#8ccfdd" d="M0 50Q150 25 300 50T600 50T900 50T1200 50V90H0Z"/></svg>
</div>

<div id="intro">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Open invitation">
    <div class="flap"></div>
    <div class="seal"><svg viewBox="0 0 100 100"><use href="#L"/></svg></div>
    <div class="hint">Tap to open</div>
  </div>
</div>

<main>
  <section class="card">
    <div class="art" aria-hidden="true">
      <svg class="fl a" viewBox="0 0 100 100"><use href="#L"/></svg>
      <svg class="fl b" viewBox="0 0 100 100"><use href="#L"/></svg>
      <svg class="couple" viewBox="0 0 200 260">
        <!-- bride hair back + veil -->
        <path d="M125 50C90 58 84 130 78 250L172 250C166 130 160 58 125 50Z" fill="#fff" opacity=".6" stroke="#e6dfd2" stroke-width="1.5"/>
        <g fill="#a8222f"><circle cx="106" cy="76" r="12"/><circle cx="102" cy="94" r="11"/><circle cx="148" cy="76" r="12"/><circle cx="152" cy="94" r="11"/><circle cx="112" cy="60" r="12"/><circle cx="126" cy="55" r="13"/><circle cx="140" cy="60" r="12"/></g>
        <!-- groom legs + shoes -->
        <rect x="50" y="198" width="22" height="46" fill="#1d1d22"/><rect x="78" y="198" width="22" height="46" fill="#1d1d22"/>
        <ellipse cx="58" cy="246" rx="16" ry="6" fill="#111"/><ellipse cx="92" cy="246" rx="16" ry="6" fill="#111"/>
        <!-- groom jacket -->
        <path d="M44 90Q75 80 106 90L114 200L36 200Z" fill="#1d1d22"/>
        <path d="M66 88L84 88L75 124Z" fill="#fff"/>
        <path d="M68 96L82 96L75 104Z" fill="#b8323f"/>
        <!-- groom head -->
        <circle cx="75" cy="60" r="24" fill="#f3d3b6"/>
        <path d="M51 56Q52 34 75 34Q98 34 99 56Q90 44 75 44Q60 44 51 56Z" fill="#14110f"/>
        <path d="M57 66Q58 82 75 83Q92 82 93 66Q90 74 75 76Q60 74 57 66Z" fill="#4a3a32" opacity=".7"/>
        <circle cx="67" cy="60" r="2.2" fill="#14110f"/><circle cx="83" cy="60" r="2.2" fill="#14110f"/>
        <path d="M68 71Q75 77 82 71" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- bride dress -->
        <path d="M110 108Q125 102 140 108L146 150L168 250L84 250L106 150Z" fill="#fff" stroke="#e6dfd2" stroke-width="2"/>
        <path d="M107 148Q125 156 145 148" stroke="#b08a4e" stroke-width="4" fill="none"/>
        <path d="M112 160Q118 210 100 246M125 160L125 248M138 160Q132 210 150 246" stroke="#eee7d9" stroke-width="2" fill="none"/>
        <!-- bride head -->
        <circle cx="125" cy="82" r="21" fill="#fae3d0"/>
        <path d="M104 78Q108 58 126 58Q144 58 146 78Q136 66 124 68Q112 68 104 78Z" fill="#a8222f"/>
        <circle cx="118" cy="84" r="2" fill="#3a2418"/><circle cx="132" cy="84" r="2" fill="#3a2418"/>
        <path d="M118 93Q125 99 132 93" stroke="#c43a63" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="112" cy="91" r="3.5" fill="#f19aa6" opacity=".6"/><circle cx="138" cy="91" r="3.5" fill="#f19aa6" opacity=".6"/>
        <path d="M99 82C96 46 154 46 151 82C146 64 104 64 99 82Z" fill="#fff" opacity=".8" stroke="#e6dfd2" stroke-width="1.2"/>
        <path d="M100 84C90 122 88 172 84 232M150 84C160 122 162 172 166 232" stroke="#fff" stroke-width="6" opacity=".55" fill="none" stroke-linecap="round"/>
        <circle cx="112" cy="57" r="4" fill="#ee9db1"/><circle cx="125" cy="53" r="4.5" fill="#b08a4e"/><circle cx="138" cy="57" r="4" fill="#ee9db1"/>
        <!-- groom arm hugging -->
        <path d="M52 108Q70 150 128 138" stroke="#1d1d22" stroke-width="13" fill="none" stroke-linecap="round"/>
        <circle cx="130" cy="138" r="7" fill="#f3d3b6"/>
        <!-- bride hand on chest -->
        <circle cx="96" cy="112" r="6" fill="#fae3d0"/>
      </svg>
    </div>
    <p class="lead">With hearts full of joy,<br>we invite you to celebrate our wedding</p>
    <h1 class="names"><b>Mohamed</b><span>&amp;</span><b>Alaa</b></h1>
    <p class="when">Saturday, 19 December 2026</p>
    <p class="time">3:00 PM</p>
    <p class="where"><strong>Nile Lotus</strong> Cruising Restaurant<br>Maadi, Cairo</p>
    <div class="cd" aria-label="Countdown">
      <div><strong id="d">0</strong><small>days</small></div>
      <div><strong id="h">0</strong><small>hours</small></div>
      <div><strong id="m">0</strong><small>minutes</small></div>
    </div>
    <a class="btn" href="https://www.google.com/maps/place/Nile+Lotus+Cruising+Restaurant/data=!4m2!3m1!1s0x0:0xec78e0731feeadf8?sa=X&amp;ved=1t:2428&amp;ictx=111" target="_blank" rel="noopener">Open location in Maps</a>
    <p class="note">Your presence will make our day complete</p>
  </section>
</main>

<script>
const env=document.getElementById('env');
function petals(){
  for(let i=0;i<22;i++){
    const p=document.createElement('span');p.className='petal';
    p.style.left=Math.random()*100+'vw';
    p.style.setProperty('--dx',(Math.random()*160-80)+'px');
    p.style.animationDuration=(5+Math.random()*4)+'s';
    p.style.animationDelay=(Math.random()*2.5)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),10000);
  }
}
function openIt(){
  if(env.classList.contains('open'))return;
  env.classList.add('open');
  setTimeout(()=>{document.getElementById('intro').classList.add('gone');document.body.classList.add('show');petals()},900);
}
env.addEventListener('click',openIt);
env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openIt()}});
const target=new Date('2026-12-19T15:00:00+02:00');
function tick(){
  const s=Math.max(0,(target-new Date())/1000);
  d.textContent=Math.floor(s/86400);h.textContent=Math.floor(s%86400/3600);m.textContent=Math.floor(s%3600/60);
}
tick();setInterval(tick,30000);
</script>
</body>
</html>
